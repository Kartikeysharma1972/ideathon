<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ideathon 2026</title>
  <meta name="robots" content="noindex">

  <!--
    ========================================================================
     THE BROCHURE QR CODE OPENS THIS PAGE. TO CHANGE WHERE THE QR GOES,
     REPLACE THE URL AFTER "url=" ON THE NEXT LINE. NOTHING ELSE NEEDS EDITING.
    ========================================================================
  -->
  <meta http-equiv="refresh" content="0; url=https://kartikeysharma1972.github.io/ideathon/site/" id="destination">

  <script>
    // Follow the destination above at once, keeping any ?src=… tag from the QR.
    (() => {
      const meta = document.getElementById('destination').content;
      const target = new URL(meta.slice(meta.indexOf('url=') + 4).trim(), location.href);
      new URLSearchParams(location.search).forEach((v, k) => target.searchParams.set(k, v));
      location.replace(target.href);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f6ee; color: #25251f; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    a { color: #7850ce; font-weight: 600; }
  </style>
</head>
<body>
  <p>Opening Ideathon 2026…<br><a id="fallback" href="https://kartikeysharma1972.github.io/ideathon/site/">Tap here if nothing happens</a></p>
  <script>
    const m = document.getElementById('destination').content;
    document.getElementById('fallback').href = m.slice(m.indexOf('url=') + 4).trim();
  </script>
</body>
</html>
