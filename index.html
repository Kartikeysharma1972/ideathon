<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ideathon 2026</title>
  <meta name="robots" content="noindex">

  <!--
    ========================================================================
     THE BROCHURE QR CODE OPENS THIS PAGE. TO CHANGE WHERE THE QR GOES,
     REPLACE THE URL AFTER "url=" ON THE NEXT LINE. NOTHING ELSE NEEDS EDITING.
    ========================================================================
  -->
  <meta http-equiv="refresh" content="0; url=https://www.codevidhya.com/" id="destination">

  <script>
    // Follow the destination above at once, keeping any ?src=… tag from the QR.
    (() => {
      const meta = document.getElementById('destination').content;
      let link = meta.slice(meta.indexOf('url=') + 4).trim();
      if (!/^[a-z]+:\/\//i.test(link)) link = 'https://' + link; // tolerate a link pasted without https://
      const target = new URL(link);
      new URLSearchParams(location.search).forEach((v, k) => target.searchParams.set(k, v));
      location.replace(target.href);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffffff; color: #25251f; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    /* stays blank during the instant redirect; the link only appears if it fails */
    #fallback-wrap { visibility: hidden; animation: show 0s 2.5s forwards; }
    @keyframes show { to { visibility: visible; } }
    a { color: #7850ce; font-weight: 600; }
  </style>
</head>
<body>
  <p id="fallback-wrap"><a id="fallback" href="https://www.codevidhya.com/">Tap here if nothing happens</a></p>
  <script>
    const m = document.getElementById('destination').content;
    const l = m.slice(m.indexOf('url=') + 4).trim();
    document.getElementById('fallback').href = /^[a-z]+:\/\//i.test(l) ? l : 'https://' + l;
  </script>
</body>
</html>
